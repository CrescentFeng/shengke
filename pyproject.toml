[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-ai-platform"
version = "0.9.0"
description = "Shared audio foundation for Tingxi, Qingtin QC, and Shengke TTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
asr-whisper = ["faster-whisper>=1,<2"]
asr-funasr = ["funasr>=1,<2"]
vad-webrtc = ["webrtcvad-wheels>=2.0.14,<3"]
shengke-ui = ["gradio>=5.4,<6"]
diarization-pyannote = [
  "pyannote.audio>=4,<5",
  "torchcodec>=0.13,<0.14",
]

[project.scripts]
audio-core = "audio_core.cli:main"
audio-platform-api = "platform_api.main:run"
audio-ingest-worker = "ingest_worker.main:run"
audio-asr-eval = "asr_eval.cli:main"
audio-vad-eval = "vad_eval.cli:main"
audio-diarization-eval = "diarization_eval.cli:main"
shengke-ui = "shengke_ui.main:main"
audio-tts-eval = "tts_eval.cli:main"

[tool.setuptools.packages.find]
where = [
  "packages/audio-core/src",
  "apps/platform-api/src",
  "apps/ingest-worker/src",
  "apps/asr-eval/src",
  "apps/vad-eval/src",
  "apps/diarization-eval/src",
  "apps/shengke-ui/src",
  "apps/tts-eval/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
